name: Publish fork container image

# This fork's own image (with the fork's code) for the HA add-on.
# Upstream publish-image.yml stays gated to Syracuse3DPrintingOrg/PantryRaider
# and is untouched; this workflow publishes ghcr.io/yskaa91/pantryraider,
# which homeassistant/addon/foodassistant/build.yaml builds FROM.
# After the first push, set the package visibility to Public once
# (GitHub -> Packages -> pantryraider -> Package settings), or HA cannot pull it.
#
# Triggers: pushes to main touching app code, or manually from Actions.

on:
  push:
    branches: [main]
    paths:
      - "service/**"
      - "gadgets/**"
      - "docker/cups/**"
      - ".github/workflows/publish-fork-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: yskaa91/pantryraider

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repo root, not ./service: the image needs gadgets/ alongside the
          # app, same layout as upstream's publish workflow.
          context: .
          file: ./service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
